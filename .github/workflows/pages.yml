name: Deploy StepMap to GitHub Pages

on:
  push:
    branches: [claude/song-search-preview-app-5i6zk1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # publishes the site to the gh-pages branch, which GitHub Pages serves;
      # the pages API isn't accessible to the workflow token on this repo
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
