<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Finder — search songs, stream them, download as MP3 or WAV</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
</head>
<body>
  <header class="hero">
    <h1><span class="logo">♪</span> Track Finder</h1>
    <p class="tagline">Search any song, listen, and download as MP3 or WAV.</p>
    <form id="search-form" class="search-bar" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search for a song or artist…" aria-label="Search for a song" required>
      <button type="submit">Search</button>
    </form>
    <div class="source-toggle" role="radiogroup" aria-label="Music source">
      <label>
        <input type="radio" name="source" value="audius" checked>
        <span>Full tracks · Audius</span>
      </label>
      <label>
        <input type="radio" name="source" value="itunes">
        <span>30s previews · iTunes</span>
      </label>
    </div>
  </header>

  <main>
    <div id="status" class="status" hidden></div>
    <ul id="results" class="results" aria-live="polite"></ul>
  </main>

  <footer>
    <p>Audius results are full tracks that artists publish for free streaming — download buttons appear when the artist allows downloads. iTunes results are 30-second preview clips.</p>
  </footer>

  <script src="/vendor/lame.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
